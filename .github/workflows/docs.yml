name: Docs

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Docusaurus site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      # The library has to be built first — the Docusaurus site imports
      # `get-browser` (via file: dependency) for its live playground.
      - name: Install root deps
        run: pnpm install --frozen-lockfile
      - name: Build library
        run: pnpm run build

      - name: Install website deps
        working-directory: website
        run: pnpm install

      - name: Build Docusaurus
        working-directory: website
        run: pnpm run build

      # The example/ directory is a static visual demo using the UMD bundle.
      # Layout we ship to Pages:
      #   /get-browser/                    Docusaurus landing
      #   /get-browser/example/index.html  visual demo
      #   /get-browser/dist/...            UMD bundle (resolved as ../dist/ from example)
      - name: Bundle static visual demo
        run: |
          mkdir -p website/build/example website/build/dist
          cp -R example/. website/build/example/
          cp -R dist/. website/build/dist/
          ls -la website/build website/build/example website/build/dist/umd

      - name: Setup Pages
        # actions/configure-pages@v5
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload artifact
        # actions/upload-pages-artifact@v3.0.1
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        # actions/deploy-pages@v4.0.5
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
