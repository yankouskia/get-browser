name: Docs

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Docusaurus site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      # The library has to be built first — the Docusaurus site imports
      # `get-browser` (via file: dependency) for its live playground.
      - name: Install root deps
        run: pnpm install --frozen-lockfile
      - name: Build library
        run: pnpm run build

      - name: Install website deps
        working-directory: website
        run: pnpm install

      - name: Build Docusaurus
        working-directory: website
        run: pnpm run build

      # The example/ directory is a static visual demo using the UMD bundle.
      # Layout we ship to Pages:
      #   /get-browser/                    Docusaurus landing
      #   /get-browser/example/index.html  visual demo
      #   /get-browser/dist/...            UMD bundle (resolved as ../dist/ from example)
      - name: Bundle static visual demo
        run: |
          mkdir -p website/build/example website/build/dist
          cp -R example/. website/build/example/
          cp -R dist/. website/build/dist/
          ls -la website/build website/build/example website/build/dist/umd

      - name: Setup Pages
        # actions/configure-pages@v5
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload artifact
        # actions/upload-pages-artifact@v3.0.1
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        # actions/deploy-pages@v4.0.5
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
