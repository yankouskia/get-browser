name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Sunday 06:00 UTC — fresh advisories from the GitHub DB.
    - cron: "0 6 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        # github/codeql-action/init@v3.27.5
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        # github/codeql-action/autobuild@v3.27.5
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938

      - name: Perform CodeQL Analysis
        # github/codeql-action/analyze@v3.27.5
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: /language:${{ matrix.language }}
