name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Sunday 06:00 UTC — fresh advisories from the GitHub DB.
    - cron: "0 6 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Initialize CodeQL
        # github/codeql-action/init@v3.27.5
        uses: github/codeql-action/init@aa578102511db1f4524ed59b8cc2bae4f6e88195
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        # github/codeql-action/autobuild@v3.27.5
        uses: github/codeql-action/autobuild@aa578102511db1f4524ed59b8cc2bae4f6e88195

      - name: Perform CodeQL Analysis
        # github/codeql-action/analyze@v3.27.5
        uses: github/codeql-action/analyze@aa578102511db1f4524ed59b8cc2bae4f6e88195
        with:
          category: /language:${{ matrix.language }}
